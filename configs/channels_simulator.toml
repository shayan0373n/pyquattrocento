# Channel layout matching the bundled simulator (dextview/simulator.py).
# Simulator wire format: channels 0-9 carry synthetic force, channel 10 the
# trigger pulse; every other channel is low-amplitude noise. Use this file for
# dry runs without hardware.
#
# Usage:
#   python run_simulator.py --trigger-interval 8.0
#   dextview --source rebroadcast --channels configs/channels_simulator.toml \
#            --host 127.0.0.1 --port 31000

[labels]
"R Thumb"  = { index = 0, scale = 5 }
"R Index"  = { index = 1, scale = 5 }
"R Middle" = { index = 2, scale = 5 }
"R Ring"   = { index = 3, scale = 5 }
"R Little" = { index = 4, scale = 5 }
"L Thumb"  = { index = 5, scale = 5 }
"L Index"  = { index = 6, scale = 5 }
"L Middle" = { index = 7, scale = 5 }
"L Ring"   = { index = 8, scale = 5 }
"L Little" = { index = 9, scale = 5 }
"trigger"  = { index = 10, scale = 5.0, kind = "trigger" }
# EMG channels are optional; the simulator emits only baseline noise on them.
# "ADM" = { index = 11, scale = 16.667, kind = "emg" }
