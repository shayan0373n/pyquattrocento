# Example 10-finger + EMG + trigger mapping from a real Quattrocento recording.
# A worked example, not a universal default: the active-channel set (and so
# these indices) changes per acquisition. This does NOT match the bundled
# simulator's layout -- use configs/channels_simulator.toml for dry runs.
#
# Usage:
#   python run_dextview.py --source=real --host=169.254.1.10 --port=23456 \
#       --sample-rate=2048 --n-channels=16 --channels=configs/channels_default.toml

[labels]
"R Thumb"  = { index = 2, scale = 5 }
"R Index"  = { index = 3, scale = 5 }
"R Middle" = { index = 4, scale = 5 }
"R Ring"   = { index = 5, scale = 5 }
"R Little" = { index = 6, scale = 5 }
"L Thumb"  = { index = 7, scale = 5 }
"L Index"  = { index = 8, scale = 5 }
"L Middle" = { index = 9, scale = 5 }
"L Ring"   = { index = 10, scale = 5 }
"L Little" = { index = 11, scale = 5 }
"trigger"  = { index = 12, scale = 5.0, kind = "trigger" }
"ADM"    = { index = 0, scale = 16.667, kind = "emg" }
"FDI"    = { index = 1, scale = 16.667, kind = "emg" }
# "EMG 3"    = { index = 2, scale = 16.667, kind = "emg" }
